<svg width="850" height="200" viewBox="0 0 850 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="850" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="850" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ADD8"/>
      <stop offset="1" stop-color="#5FD4F0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ADD8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00ADD8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="850" height="200" rx="14" fill="url(#bg)"/>
  <rect width="850" height="200" rx="14" fill="url(#fade)"/>
  <rect x="1" y="1" width="848" height="198" rx="13" stroke="#00ADD8" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- decorative braces / code motif -->
  <text x="60" y="130" font-family="'JetBrains Mono','Courier New',monospace" font-size="120" fill="#00ADD8" fill-opacity="0.07" font-weight="700">{ }</text>
  <text x="690" y="175" font-family="'JetBrains Mono','Courier New',monospace" font-size="90" fill="#00ADD8" fill-opacity="0.06" font-weight="700">go</text>

  <!-- accent bar -->
  <rect x="70" y="62" width="5" height="76" rx="2.5" fill="url(#accent)"/>

  <!-- name -->
  <text x="95" y="92" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="700" fill="#e6edf3">Maxim Atroshchenko</text>
  <!-- role -->
  <text x="97" y="126" font-family="'JetBrains Mono','Courier New',monospace" font-size="19" font-weight="500" fill="#00ADD8">Go Backend Developer</text>
  <!-- sub -->
  <text x="97" y="152" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8b949e">Information Security student @ SPbPU</text>
</svg>
